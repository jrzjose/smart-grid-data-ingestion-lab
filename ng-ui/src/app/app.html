<mat-sidenav-container class="app-container" [class.app-light-theme]="mode==='light'" [class.app-dark-theme]="mode==='dark'">
  <mat-sidenav class="sidenav" mode="side" opened>
    <mat-toolbar color="primary">Menu</mat-toolbar>
    <mat-nav-list>
      <a mat-list-item routerLink="" routerLinkActive="active">
        <mat-icon>dashboard</mat-icon>
        <span>Dashboard</span>
      </a>
      <a mat-list-item routerLink="/locations" routerLinkActive="active" >
        <mat-icon>list_alt</mat-icon>
        <span>Locations</span>
      </a>
      <a mat-list-item routerLink="/meters" routerLinkActive="active" >
        <mat-icon>holiday_village</mat-icon>
        <span>Meters</span>
      </a>
      <a mat-list-item routerLink="/visualizations" routerLinkActive="active" >
        <mat-icon>area_chart</mat-icon>
        <span>Visualizations</span>
      </a>
    </mat-nav-list>
    <mat-divider></mat-divider>
    <div style="padding:12px; font-size:12px; opacity:0.7">© {{ currentTimeStamp }} Company</div>
  </mat-sidenav>

  <mat-sidenav-content>
    <mat-toolbar color="primary" class="toolbar">
      <button mat-icon-button (click)="toggle()" class="menu-button" aria-label="Open menu">
        <mat-icon>menu</mat-icon>
      </button>
      <span class="title">{{ title() }}</span>
      <span class="spacer"></span>
      <button mat-icon-button (click)="toggleTheme()" aria-label="Toggle theme">
        <mat-icon>{{ mode === 'light' ? 'dark_mode' : 'light_mode' }}</mat-icon>
      </button>
    </mat-toolbar>

    <div class="content">
      <router-outlet></router-outlet>
    </div>
  </mat-sidenav-content>
</mat-sidenav-container>
