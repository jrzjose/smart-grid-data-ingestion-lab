<mat-card>
  <h2>Energy Consumption Table</h2>
  <table mat-table [dataSource]="dataSource$ | async" class="mat-elevation-z8">

    <!-- customerType Column -->
    <ng-container matColumnDef="customerType">
      <th mat-header-cell *matHeaderCellDef> customer Type </th>
      <td mat-cell *matCellDef="let element"> {{element.customerType}} </td>
    </ng-container>

    <!-- Energy Column -->
    <ng-container matColumnDef="energyConsumption">
      <th mat-header-cell *matHeaderCellDef> Energy (kWh) </th>
      <td mat-cell *matCellDef="let element"> {{element.energyConsumption}} </td>
    </ng-container>

    <!-- Start Time Column -->
    <ng-container matColumnDef="startTime">
      <th mat-header-cell *matHeaderCellDef> Start Time </th>
      <td mat-cell *matCellDef="let element"> {{formatDate(element.startTime)}} </td>
    </ng-container>

    <!-- End Time Column -->
    <ng-container matColumnDef="endTime">
      <th mat-header-cell *matHeaderCellDef> End Time </th>
      <td mat-cell *matCellDef="let element"> {{formatDate(element.endTime)}} </td>
    </ng-container>

    <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
    <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
  </table>
</mat-card>
